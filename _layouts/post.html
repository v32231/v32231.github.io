---
layout: default
---

{% include site-header.html %}

<main class="main container post-layout">
  <article class="article article--post content typeset">
    <header class="post-header">
      <h1 class="post-title">{{ page.title }}</h1>
      {% include post-meta.html %}
    </header>

    <div class="post-body" id="post-content">
      {{ content }}
    </div>

    {% include nav-share.html %}
    {% include post-comments.html %}
  </article>

  <aside class="post-toc" aria-label="이 글의 목차">
    <p class="post-toc__title">목차</p>
    <nav>
      <ol class="post-toc__list" id="post-toc-list"></ol>
    </nav>
  </aside>
</main>

{% include site-footer.html %}
